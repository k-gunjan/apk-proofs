[package]
name = "apk-proofs"
version = "0.1.0"
authors = ["Sergey Vasilyev <swasilyev@gmail.com>"]
edition = "2018"
description = "Succinct proofs of a BLS public key being an aggregate key of a subset of signers given a commitment to the set of all signers' keys"
repository = "https://github.com/w3f/apk-proofs"
categories = ["cryptography"]

[dependencies]
ark-std = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-ec = { version = "0.5", default-features = false }
ark-poly = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false, features = ["derive"] }

ark-bw6-761 = { version = "0.5", default-features = false }
ark-bw6-767 = { version = "0.5", default-features = false }
ark-bls12-377 = { version = "0.5", default-features = false, features = ["curve"] }
ark-bls12-381 = { version = "0.5", default-features = false, features = ["curve"] }

# Pinned: an unpinned git dependency makes the build non-reproducible, which would
# quietly void the Docker-based reproducibility the milestone promises.
#
# NOTE: this revision cannot generate a KZG SRS for BW6-767 — URS::from_trapdoor asserts
# n <= 2^TWO_ADICITY, which is 2 there. See instances::bls12_381_bw6_767::kzg::generate_urs.
w3f-pcs = { git = "https://github.com/w3f/fflonk", rev = "26b6e2e15f7fa90eee97ebd039a4146a8dafc695" }

rand = "0.8"
merlin = "3.0"
# Used to derive subgroup generators: computing (q-1)/n needs division on the modulus,
# which ark_ff::BigInteger does not provide.
num-bigint = "0.4"
num-integer = "0.1"
blake2 = "0.9"
rayon = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "bench"
harness = false

[[example]]
name = "apk_377"

[[example]]
name = "apk_381"

[[test]]
name = "basic"
harness = false

[[test]]
name = "packed"
harness = false

[[test]]
name = "counting"
harness = false

[features]
default = []
std = ["ark-std/std", "ark-ff/std", "ark-ec/std", "ark-poly/std", "ark-serialize/std"]
parallel = ["std", "ark-std/parallel", "ark-ff/parallel", "ark-ec/parallel", "ark-poly/parallel", "w3f-pcs/parallel", "rayon"]
print-trace = ["ark-std/print-trace"]
